<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150">

<style>
  text { font-family: 'JetBrains Mono','Iosevka','SFMono-Regular','Cascadia Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; font-size: 14px; fill: #c7c2c4; }
  .dim { fill: #8a7a80; }
  .mag { fill: #c27a6e; }
  .cyan { fill: #d39184; }
  .b { font-weight: 700; }
  .ln { animation: in .25s ease-out both; }
  .cur { animation: blink 1.1s steps(1) infinite; }
  @keyframes in { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ln { animation: none; opacity: 1; } .cur { animation: none; } }
</style>
<rect x="1" y="1" width="838" height="148" rx="10" fill="#200e14" stroke="#725d64" stroke-width="1.5"/>
<path d="M1 33 H839" stroke="#725d64" stroke-opacity=".5"/>
<circle cx="20" cy="17" r="5" fill="#9B5E55"/><circle cx="38" cy="17" r="5" fill="#74433B"/><circle cx="56" cy="17" r="5" fill="#6A4944"/>
<text x="420.0" y="22" text-anchor="middle" class="dim" style="font-size:12px">~/projects/aula-web-driver</text>
<text x="24" y="60"><tspan class="mag">❯</tspan> cd ~/projects/aula-web-driver</text>
<text x="24" y="88" class="cyan b" style="font-size:17px">aula-web-driver</text>
<text x="24" y="112" class="dim">makes aula&#x27;s browser-based keyboard driver work on any linux distro:</text>
<text x="24" y="131" class="dim">adds the udev rule, finds or installs a browser with webhid.</text>
<text x="816" y="88" text-anchor="end" class="dim" style="font-size:12px"><tspan class="mag">●</tspan> Shell   #udev #webhid</text>
</svg>
